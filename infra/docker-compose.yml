# Весь стенд одной командой (Docker Compose ≥ 2.20 — нужен include):
#   cd infra && docker compose up --build
#   Фронт     :8080             (WEB_PORT; nginx: /api → сервис api, документация API — /api/docs и /api/redoc)
#   API       :8000/api/docs    (API_PORT)
#   WireMock  :8081/__admin     (WIREMOCK_PORT; моки реестров, БКИ, банка)
#   Postgres  :55432            (DB_PORT)
# Служебные порты слушают только BIND_HOST (по умолчанию 127.0.0.1); фронт — все интерфейсы.
# Бэкенд описан в backend/docker-compose.yml и подключается сюда целиком: один источник правды, бэкенд можно
# поднимать и отдельно. Фронт собирается из frontend/ без правок в нём — Dockerfile лежит здесь, в infra/.
name: alfa-horizon

include:
  - ../backend/docker-compose.yml

services:
  web:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
