# Стенд на сервере за Caddy с HTTPS (Docker Compose ≥ 2.24 — нужен !reset):
#   cd infra && cp .env.example .env    # домен и свой секрет
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#   Кабинет   https://alfahorizon.duckdns.org
#   API       https://alfahorizon.duckdns.org/api/docs
# Наружу смотрят только 80 и 443 Caddy: порт фронта закрыт, служебные порты бэкенда и так слушают только 127.0.0.1.
services:
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:-alfahorizon.duckdns.org}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # сертификаты и ключи: без тома Caddy запрашивает их заново и упирается в лимиты Let's Encrypt
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  web:
    ports: !reset []

  # Без своего секрета запуск падает сразу: значение по умолчанию из репозитория на сервере не годится.
  api:
    environment: &secret
      DEMO_TOKEN_SECRET: ${DEMO_TOKEN_SECRET:?задайте DEMO_TOKEN_SECRET в infra/.env}
  worker:
    environment: *secret
  migrate:
    environment: *secret

volumes:
  caddy_data: {}
  caddy_config: {}
