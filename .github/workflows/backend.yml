name: backend

on:
  pull_request:
    paths: ["backend/**", "docs/test-scenarios.md", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "docs/test-scenarios.md", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Моки совпадают с демо-миром
        run: uv run python -m seed.gen_mocks && git diff --exit-code -- wiremock
      - run: uv run pytest -q
      - name: Сводка тестовых сценариев актуальна
        run: uv run python -m qa.report && git diff --exit-code -- ../docs/test-scenarios.md
