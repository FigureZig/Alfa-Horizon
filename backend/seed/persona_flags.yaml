# Флаги конструктора «своя компания» (POST /api/v1/sandbox/personas, поле flags; каталог — GET /api/v1/sandbox/persona-options).
# Флаг — особенность компании фактом (effect): что она значит для кредита, объясняет решение банка, а не карточка.
# Флаг задаёт параметры компании поверх полей запроса (spec — те же ключи, что у seed/world.py custom) и/или включает
# отказ источника для этого пользователя (faults). expect — что флаг обязан изменить в решении на эталонной заявке;
# это проверяет tests/test_persona_flags.py: флаг, который ни на что не влияет, тест не пропустит.
#   reason — код в причинах решения или в трёх самых слабых факторах скоринга;
#   product — продукт становится доступен; fault — у пользователя включается отказ источника.

groups:
  registries:     { ru: "Реестры и право", en: "Registers and law" }
  credit_history: { ru: "Кредитная история", en: "Credit history" }
  business:       { ru: "Обороты и бизнес", en: "Turnover and business" }
  integrations:   { ru: "Внешние системы", en: "External systems" }

flags:
  tax_debt:
    group: registries
    forms: [IP, LLC, JSC]
    title: { ru: "Налоговая недоимка", en: "Tax arrears" }
    effect: { ru: "Недоимка 150 000 ₽ по данным ФНС",
              en: "₽150K of tax arrears according to the tax service" }
    spec: { tax_debt: 150000 }
    expect: { reason: STOP_TAX_DEBT }
  bankruptcy:
    group: registries
    forms: [IP, LLC, JSC]
    title: { ru: "Банкротство", en: "Bankruptcy" }
    effect: { ru: "Сообщение о банкротстве в ЕФРСБ",
              en: "A bankruptcy notice in the federal register" }
    flags: [bankruptcy]
    expect: { reason: STOP_BANKRUPTCY }
  liquidation:
    group: registries
    forms: [LLC, JSC]
    title: { ru: "Ликвидация", en: "Liquidation" }
    effect: { ru: "Запись о ликвидации в ЕГРЮЛ",
              en: "A liquidation record in the company register" }
    flags: [liquidation]
    expect: { reason: STOP_LIQUIDATION }
  unreliable_eio:
    group: registries
    forms: [LLC, JSC]
    title: { ru: "Недостоверные сведения о директоре", en: "Unreliable director record" }
    effect: { ru: "Отметка ФНС о недостоверности сведений о руководителе",
              en: "The tax service marked the director record as unreliable" }
    flags: [unreliable_eio]
    expect: { reason: STOP_EIO_UNRELIABLE }
  disqualified_eio:
    group: registries
    forms: [LLC, JSC]
    title: { ru: "Директор дисквалифицирован", en: "Disqualified director" }
    effect: { ru: "Руководитель в реестре дисквалифицированных лиц",
              en: "The director is in the disqualified persons register" }
    flags: [disqualified_eio]
    expect: { reason: STOP_EIO_DISQUALIFIED }
  large_deal:
    group: registries
    forms: [LLC]
    title: { ru: "Крупная сделка, три участника", en: "Major transaction, three members" }
    effect: { ru: "Три участника ООО, активы по отчётности — около 10% годовой выручки: сделка больше 25% активов — крупная (14-ФЗ ст. 46 п. 1)",
              en: "Three LLC members, assets of about 10% of annual revenue: a deal above 25% of assets is a major one" }
    spec: { participants: 3, assets_share: 0.1 }
    expect: { reason: REQ_CORP_APPROVAL }
  overdue_serious:
    group: credit_history
    forms: [IP, LLC, JSC]
    title: { ru: "Просрочка больше 90 дней", en: "Delinquency over 90 days" }
    effect: { ru: "Просрочка 120 дней по действующему кредиту",
              en: "120 days past due on an active loan" }
    spec: { overdue_days: 120 }
    expect: { reason: STOP_DELINQUENCY }
  overdue_recent:
    group: credit_history
    forms: [IP, LLC, JSC]
    title: { ru: "Недавняя просрочка до 30 дней", en: "Recent delinquency up to 30 days" }
    effect: { ru: "Просрочка 20 дней по кредиту",
              en: "A 20-day delay on a loan" }
    spec: { overdue_days: 20 }
    expect: { reason: SC_DELINQUENCY }
  credit_hunger:
    group: credit_history
    forms: [IP, LLC, JSC]
    title: { ru: "Много запросов в БКИ", en: "Many credit bureau inquiries" }
    effect: { ru: "9 запросов кредитной истории за последние 30 дней",
              en: "9 credit history inquiries in the last 30 days" }
    spec: { bki_requests: 9 }
    expect: { reason: SC_CREDIT_HUNGER }
  high_debt_load:
    group: credit_history
    forms: [IP, LLC, JSC]
    title: { ru: "Высокая долговая нагрузка", en: "High debt load" }
    effect: { ru: "Платежи по кредитам — половина поступлений на счёт",
              en: "Loan payments take half of the account inflows" }
    spec: { debt_load: 0.5 }
    expect: { reason: SC_HIGH_DEBT_LOAD }
  young_business:
    group: business
    forms: [IP, LLC, JSC]
    title: { ru: "Бизнесу 4 месяца", en: "Business is 4 months old" }
    effect: { ru: "Бизнесу 4 месяца",
              en: "The business is 4 months old" }
    spec: { age_months: 4 }
    expect: { reason: POL_BUSINESS_AGE }
  unstable_inflows:
    group: business
    forms: [IP, LLC, JSC]
    title: { ru: "Нестабильные поступления", en: "Unstable inflows" }
    effect: { ru: "Поступления скачут от месяца к месяцу — разброс около 80%",
              en: "Inflows swing month to month — about 80% variation" }
    spec: { inflow_cv: 0.8 }
    expect: { reason: SC_UNSTABLE_INFLOWS }
  declining_inflows:
    group: business
    forms: [IP, LLC, JSC]
    title: { ru: "Поступления падают", en: "Declining inflows" }
    effect: { ru: "Последние 3 месяца поступлений на 45% ниже предыдущих",
              en: "The last 3 months of inflows are 45% below the previous ones" }
    spec: { inflow_trend: -0.45 }
    expect: { reason: SC_DECLINING_INFLOWS }
  loss:
    group: business
    forms: [LLC, JSC]
    title: { ru: "Убыток по отчётности", en: "Loss in the financial statements" }
    effect: { ru: "Чистый убыток в бухотчётности за прошлый год",
              en: "A net loss in last year's financial statements" }
    spec: { profit_margin: -0.08 }
    expect: { reason: SC_LOSS }
  gov_contract:
    group: business
    forms: [IP, LLC, JSC]
    title: { ru: "Действующий госконтракт", en: "Active government contract" }
    effect: { ru: "Действующий госконтракт на 15 млн ₽ в ЕИС, аванс 20%",
              en: "An active ₽15M public contract, 20% advance" }
    spec: { contract_price: 15000000 }
    expect: { product: CONTRACT }
  bki_down:
    group: integrations
    forms: [IP, LLC, JSC]
    title: { ru: "БКИ не отвечает", en: "Credit bureau is down" }
    effect: { ru: "Бюро кредитных историй не отвечает",
              en: "The credit bureau does not respond" }
    faults: [{ source: bki, mode: timeout }]
    expect: { fault: bki }
