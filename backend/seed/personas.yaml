# inflows — поступления за 12 полных месяцев до today (2025-10 … 2026-09), от старого к новому.
# outflows — регулярные платежи [назначение, день месяца, сумма, категория]; если не заданы — генерируются от оборотов.
#   Платежи по кредитам в выписку добавляются сами, из БКИ.
# bki.credits — [сумма, ставка % годовых, срок мес., оплачено мес., макс. просрочка дн.]; платёж и остаток долга
#   считаются по аннуитету (world.credits). Категория МСП выводится из численности и дохода (209-ФЗ ст. 4).
# flags — события в реестрах: liquidation, bankruptcy, unreliable_eio, disqualified_eio. eio — [человек, должность].
# scenario.expect — golden-результат движка в режиме commit при работающих источниках.
